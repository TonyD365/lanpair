name: Homepage

# Publishes site/ (plus the demo GIF) to https://tonyd365.github.io/lanpair/ whenever it
# changes on main. Settings → Pages → Source must be "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/assets/demo.gif", "docs/assets/logo.svg", "docs/assets/icon.svg", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp docs/assets/demo.gif docs/assets/logo.svg docs/assets/icon.svg _site/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
