name: CI

on:
  push:
    branches: [main]
  pull_request:
    # A pull request that only changes documentation skips the tests (main still runs
    # everything after the merge).
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]  # requirements/ and fuzz/ do run CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements/dev.txt
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  bots:
    name: Bot function tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions/pr-assistant
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
      - run: deno fmt --check
      - run: deno check index.ts assistant_test.ts bots_test.ts logic_test.ts
      - run: deno test --allow-env --no-prompt .
      - run: deno audit

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.15"] # oldest and newest on every system
        include: # the versions in between, on Linux
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --require-hashes -r requirements/dev.txt
      - run: python -m pip install --no-deps -e .
      - run: pytest

  fuzz:
    # Coverage-guided fuzzing of the code that parses untrusted network input. Anything
    # other than EnvelopeError is a crash, which fails the job and keeps the crashing input.
    name: Fuzz network input
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements/fuzz.txt
      - run: python -m pip install --no-deps -e .
      - name: Fuzz for 60 seconds, starting from the seed envelopes in fuzz/corpus
        run: |
          mkdir -p corpus-work
          python fuzz/fuzz_opener.py corpus-work fuzz/corpus -dict=fuzz/json.dict \
            -max_total_time=60 -artifact_prefix=crash-
      - name: Fuzz the 6-digit code pairing messages for 45 seconds
        run: |
          mkdir -p code-work
          python fuzz/fuzz_codepair.py code-work -dict=fuzz/json.dict \
            -max_total_time=45 -artifact_prefix=crash-code-
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-crash
          path: crash-*
          if-no-files-found: ignore
