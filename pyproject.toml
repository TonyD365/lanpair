[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lanpair"
version = "1.0.0rc1"
description = "Secure pairing and signed messaging between devices on the same LAN"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "TonyD365" }]
dependencies = ["cryptography>=50.0.2"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]

[project.optional-dependencies]
keyring = ["keyring>=25"]
discovery = ["zeroconf>=0.136"]
dev = ["pytest>=9.2.0", "ruff>=0.17.5", "mypy>=2.4.1", "keyring>=25", "zeroconf>=0.136"]

[project.urls]
Homepage = "https://github.com/TonyD365/lanpair"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
