[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lanpair"
version = "1.4.0"
description = "Secure pairing and signed messaging between devices on the same LAN"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "TonyD365" }]
dependencies = ["cryptography>=50.0.2"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]

[project.optional-dependencies]
keyring = ["keyring>=25"]
discovery = ["zeroconf>=0.136"]
qr = ["segno>=1.6"]
all = ["keyring>=25", "zeroconf>=0.136", "segno>=1.6"]
dev = [
    "pytest>=9.2.0", "ruff>=0.17.5", "mypy>=2.4.1", "hypothesis",
    "keyring>=25", "zeroconf>=0.136", "segno>=1.6",
]

[project.urls]
Homepage = "https://tonyd365.github.io/lanpair/"
Documentation = "https://github.com/TonyD365/lanpair/wiki"
Source = "https://github.com/TonyD365/lanpair"
Issues = "https://github.com/TonyD365/lanpair/issues"
Changelog = "https://github.com/TonyD365/lanpair/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
